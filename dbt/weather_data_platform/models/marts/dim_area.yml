version: 2

models:
  - name: dim_area
    config:
      tags: ["dim", "area"]
    description: Area dimension table for weather alert analytics.

    meta:
      owner: "Data Team"
      business_owner: "Charlene Lin"
      data_tier: "Tier_1"

    columns:
      - name: area_key
        description: Surrogate key for area (Generated by MD5 of city and area).
        data_type: string
        tests:
          - unique
          - not_null
        meta:
          classification: Public

      - name: city
        description: City name.
        data_type: string
        tests:
          - not_null
        meta:
          classification: Public

      - name: area 
        description: Area name.
        data_type: string
        tests:
          - not_null
        meta:
          classification: Public