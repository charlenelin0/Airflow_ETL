version: 2

sources:

  - name: raw_data
    
    # Postgres
    # database: test
    # schema: public
    # description: Raw weather data loaded from Postgres

    database: "{% if target.name == 'bigquery' %}bq-test-499005{% else %}test{% endif %}"
    
    schema: "{% if target.name == 'bigquery' %}weather_platform{% else %}public{% endif %}"
    
    description: >
      {% if target.name == 'bigquery' %}
      Raw weather data loaded from Bigquery
      {% else %}
      Raw weather data loaded from Postgres
      {% endif %}

    tables:
    - name: staging_forecast
      description: Raw weather forecast data.

      columns:
      - name: city
        description: City name.
      - name: type
        description: Weather element type.
      - name: start_time
        description: Forecast start time.
      - name: temp
        description: Forecast temperature in Celsius.

    - name: staging_alert
      description: Raw weather alert data.

      columns:
      - name: event
        description: Alert event name.
      - name: level
        description: Alert severity level.
      - name: area
        description: Affected area.
      - name: date
        description: Alert issued date.